# Produção: usa a imagem publicada no GitHub Container Registry.
# A stack dos microservices deve estar ativa e sua rede externa deve existir.

services:
  finances-ui:
    image: ${FINANCES_UI_IMAGE:-ghcr.io/eduhsilva/finances-ui:${IMAGE_TAG:-latest}}
    container_name: finances-ui
    restart: unless-stopped
    expose:
      - "80"
    networks:
      default: {}
      ehs_microservices:
        aliases:
          - finances-ui

networks:
  ehs_microservices:
    external: true
    name: ${EHS_MICROSERVICES_NETWORK:-microservices_backend}
